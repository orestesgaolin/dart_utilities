name: disk_analyzer_cli
description: CLI tool to analyze disk space, visualize usage, and clean up files.
version: 1.0.1
repository: https://github.com/orestesgaolin/dart_utilities
issue_tracker: https://github.com/orestesgaolin/dart_utilities/issues
screenshots:
  - description: Disk usage visualization in the terminal
    path: doc/screenshot_tui.png
topics:
  - cli
  - disk-analyzer
  - disk-usage
  - nocterm

environment:
  sdk: ^3.11.5

dependencies:
  args: ^2.7.0
  ffi: ^2.1.4
  nocterm: ^0.6.0
  path: ^1.9.1
  sqlite3: ^3.3.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  disk_analyzer_cli:
